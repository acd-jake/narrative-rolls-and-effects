<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" fill="none">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#00b8ff" />
      <stop offset="100%" stop-color="#0088cc" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="412" height="332" stroke="url(#neonGrad)" stroke-width="2.5" filter="url(#glow)" />
  <rect x="11" y="11" width="398" height="318" stroke="url(#neonGrad)" stroke-width="1" stroke-opacity="0.5" filter="url(#glow)" />

  <!-- Top-Left Cyberpunk Corner (Aggressive Angles) -->
  <g stroke="url(#neonGrad)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)">
    <line x1="4" y1="8" x2="20" y2="4" />
