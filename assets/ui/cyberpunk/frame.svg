  <!-- Bottom-Right Cyberpunk Corner -->
  <g stroke="url(#neonGrad)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)">
    <line x1="416" y1="332" x2="400" y2="336" />
    <line x1="400" y1="336" x2="416" y2="336" />
    <line x1="412" y1="300" x2="416" y2="336" />
    <line x1="380" y1="336" x2="416" y2="336" />
