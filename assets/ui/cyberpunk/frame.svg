    <path d="M 10 15 L 25 25 M 15 10 L 30 20" stroke-width="1" stroke-opacity="0.8" />
    <path d="M 8 8 L 32 32" stroke-width="0.8" stroke-opacity="0.5" />
  </g>

  <!-- Top-Right Cyberpunk Corner -->
